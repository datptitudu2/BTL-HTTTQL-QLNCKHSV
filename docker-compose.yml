version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: srms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-srms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-srms_secret_2026}
      POSTGRES_DB: ${DB_NAME:-srms_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srms_user -d srms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: srms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: srms-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:

